version: "2"

name: Slack Agent Connector
description: Connect any DevRev AI agent to a Slack app. Install once per Slack app and agent pair; DMs and channel mentions invoke the agent and replies return to the thread.

service_account:
  display_name: Slack Agent Connector
  scopes:
    self:
      - scope: app_fragment:write
        optional: false
        reason: Install hidden DM fields used to correlate agent replies with Slack threads.
      - scope: custom_object:slack_connector_state:all
        optional: false
        reason: Store per-channel Slack polling cursors, thread watches, and tick status.
      - scope: custom_object:slack_connector_receipt:all
        optional: false
        reason: Store write-ahead dispatch receipts so each Slack message invokes the agent exactly once.
      - scope: tenant_fragment:write
        optional: false
        reason: Define the custom object types that hold Slack polling state.
      - scope: role:read
        optional: true
        reason: Resolve the Viewer role used to share polling state read-only with the act-as user for inspection.
      - scope: artifact:read
        optional: true
        reason: Download agent-generated artifacts so they can be attached to Slack replies.
      - scope: dev_org:read
        optional: false
        reason: Validate that the agent and act-as user belong to the installed org and resolve the DevRev organization slug during activation.
      - scope: ai_agent:read
        optional: false
        reason: Resolve the agent service account ID for reply filtering.
      - scope: ai_agent_session:read
        optional: true
        reason: Record the actual workflow agent session identity and runtime when accessible; otherwise record an explicit unknown instead of substituting the current agent default.
    impersonate:
      - act_as: all_devusers
        scopes:
          - scope: ai_agent:execute
            optional: true
            reason: Execute the agent from DM timeline comments on behalf of the act-as user.
          - scope: ai_agent:read
            optional: true
            reason: Resolve the agent as the act-as user when adding it to the DM, and as a fallback for agent lookup.
          - scope: ai_agent_session:write
            optional: false
            reason: Create DM timeline comments that execute the agent on behalf of the act-as user.
          - scope: artifact:create
            optional: true
            reason: Upload Slack attachments so the agent can inspect them.
          - scope: dev_user:read
            optional: false
            reason: Validate act-as user identity during act-as token issuance.

inputs:
  organization:
    - name: agent_id
      description: DON of the AI agent to invoke for every request. Must belong to the org this snap-in is installed in.
      field_type: id
      id_type:
        - ai_agent
      default_value: "don:core:dvrv-us-1:devo/XXXXXXX:ai_agent/1"
      is_required: true
      ui:
        display_name: Agent
    - name: act_as_user_id
      description: DON of the DevRev user who owns every agent invocation. Must belong to the same org as the agent.
      field_type: text
      default_value: "don:identity:dvrv-us-1:devo/XXXXXXX:devu/1"
      is_required: true
      ui:
        display_name: Act-as user ID
    - name: debug_errors
      description: Debugging only. When true, Slack failure replies include the failing step and a redacted, trimmed DevRev error. Keep false in production.
      field_type: bool
      default_value: false
      is_required: false
      ui:
        display_name: Show debug errors in Slack
    - name: display_name
      description: Name of the agent as shown in Slack failure replies, for example UI Ops agent.
      field_type: text
      default_value: "DevRev agent"
      is_required: false
      ui:
        display_name: Agent display name
    - name: invoke_mode
      description: "How a Slack message reaches the agent. agent (default) creates a DM and invokes the agent; the agent reply is relayed to the thread. workflow records a receipt carrying the Slack message facts and does nothing else, so a workflow on the receipt-created trigger decides what happens next."
      field_type: text
      default_value: "agent"
      is_required: false
      ui:
        display_name: Invoke mode (agent or workflow)
    - name: channel_allowlist
      description: Optional comma-separated Slack channel IDs. When set, only these channels are polled. Empty means every conversation the bot belongs to.
      field_type: text
      is_required: false
      ui:
        display_name: Channel allowlist
    - name: slack_app_id
      description: Slack application ID discovered during activation.
      field_type: text
      is_required: false
      ui:
        display_name: Slack app ID
        is_hidden: true
    - name: slack_team_id
      description: Slack workspace ID discovered during activation.
      field_type: text
      is_required: false
      ui:
        display_name: Slack team ID
        is_hidden: true
    - name: slack_bot_user_id
      description: Slack bot user ID discovered during activation.
      field_type: text
      is_required: false
      ui:
        display_name: Slack bot user ID
        is_hidden: true
    - name: dev_org_slug
      description: DevRev organization slug discovered during activation.
      field_type: text
      is_required: false
      ui:
        display_name: DevRev organization slug
        is_hidden: true

keyrings:
  organization:
    - name: slack_connection
      display_name: Slack bot token
      description: Bot User OAuth Token (xoxb-…) of the Slack app this install connects. Use one Slack app per install.
      types:
        - snap_in_secret

event_sources:
  organization:
    - name: slack-poll-timer
      display_name: Slack poll timer
      description: Fires every minute to poll Slack for agent DMs and @mentions. No public webhook URL is used.
      type: timer-events
      config:
        cron: "* * * * *"
        metadata:
          event_key: slack_poll
    - name: agent-dm-events
      display_name: Agent response events
      description: Receives agent DM replies.
      type: devrev-webhook
      config:
        event_types:
          - timeline_entry_created
          - ai_agent_response
        filter:
          jq_query: |
            if .type == "timeline_entry_created" then
              .timeline_entry_created.entry.type == "timeline_comment" and
              .timeline_entry_created.entry.object_type == "dm"
            elif .type == "ai_agent_response" then
              true
            else
              false
            end

functions:
  - name: devrev_handler
    description: Routes polling ticks, asynchronous agent replies and tracked workflow replies to their existing handlers.
  - name: hook_handler
    description: Validates org membership, claims the Slack app, and installs DM correlation and Slack polling state schemas.

hooks:
  - type: validate
    function: hook_handler
  - type: activate
    function: hook_handler
  - type: update
    function: hook_handler
  - type: deactivate
    function: hook_handler

automations:
  - name: poll-slack-for-agent-requests
    source: slack-poll-timer
    event_types:
      - timer.tick
    function: devrev_handler
  - name: relay-agent-response-to-slack
    source: agent-dm-events
    event_types:
      - timeline_entry_created
      - ai_agent_response
    function: devrev_handler

# Generic tracked Slack response, registered through the native SDK OperationMap contract.
# Existing event handlers/hooks/automations/keyrings stay unchanged. The native adapter invokes
# the same response logic; no new package, install or logging service.
operations:
  - name: manage_slack_response
    slug: manage_slack_response
    description: Track one Slack response end to end for a tracked incoming message (prepare the record, record agent-authored triage rationale/decision, send through an atomic write-ahead lock, reconcile against Slack thread history, read status, or finalize/record a definite failure). Never resends an existing lock automatically.
    function: devrev_handler
    type: action
    keyrings:
      - name: slack_connection
        description: Existing Slack bot connection used for replies and reconciliation.
        optional: true
        types: [snap_in_secret]
        display_name: Slack bot token
    static_scopes:
      self:
        - scope: snap_in:read
        - scope: custom_object:slack_connector_state:all
        - scope: custom_object:slack_connector_receipt:read
        - scope: ai_agent_session:read
        - scope: role:read
    inputs:
      fields:
        - name: node
          field_type: text
          default_value: manage_slack_response
          is_required: true
          description: Fixed per-operation route literal the shared devrev_handler function dispatches on. Not caller- or model-supplied.
          ui: { is_hidden: true }
        - name: snap_in_id
          field_type: text
          is_required: false
          description: Installed connector ID supplied by the configured workflow step.
          ui: { is_hidden: true }
        - name: action
          field_type: enum
          allowed_values: [prepare, record_triage, send, reconcile, get, finalize, fail]
          is_required: true
          description: Response-tracking step to perform.
        - name: channel
          field_type: text
          is_required: true
          description: Slack channel ID of the tracked message.
        - name: message_ts
          field_type: text
          is_required: true
          description: Slack ts of the incoming message this response answers.
        - name: thread_ts
          field_type: text
          description: Slack thread_ts of the incoming message, when it is a reply.
        - name: receipt_id
          field_type: text
          description: Original intake receipt ID; validated to match channel/message/thread/install on the initial send.
        - name: workflow_run_id
          field_type: text
          description: Correlating workflow run ID, recorded for journaling only.
        - name: session_key
          field_type: text
          description: Deprecated correlation passthrough; the acting session's creator/runtime/version are journaled from the trusted agent_session_id via ai-agent.sessions.get, never from this field.
        - name: agent_session_id
          field_type: id
          id_type: [ai_agent_session]
          description: Injected by the workflow skill from authenticated execution metadata. Trusted, never model-supplied.
          ui: { is_hidden: true }
        - name: skill_call_id
          field_type: text
          description: Injected by the workflow skill from authenticated execution metadata. Trusted, never model-supplied.
          ui: { is_hidden: true }
        - name: rationale
          field_type: text
          description: Agent-authored rationale for the triage decision or the send. Required for record_triage and send.
        - name: decision
          field_type: text
          description: Agent-authored decision summary. Required for record_triage and send.
        - name: job_id
          field_type: text
          description: Selected job Issue this response belongs to. Omit for an explicit no-job contact question.
        - name: acting_session
          field_type: text
          description: Existing working session for the selected job, when known. This response does not change the job's working session.
        - name: response_event
          field_type: text
          default_value: initial
          description: Response-event key distinguishing the sender's initial response from a later, separate background progress event. Namespaced as response:<install>:<channel>:<incoming_message_ts>:<response_event>.
        - name: text
          field_type: text
          description: Response text to send. Never logged or echoed back; prepare stores only a hash.
        - name: error_code
          field_type: text
          description: Explicit error code to record via fail.
    outputs:
      fields:
        - name: outcome
          field_type: text
          description: ok, blocked, unknown, or error.
        - name: posted
          field_type: bool
          description: True only when a Slack post was confirmed sent on this call; preserved for compatibility with the legacy HTTP sender result shape.
        - name: slack_ts
          field_type: text
          description: Confirmed Slack message ts, when known.
        - name: record_id
          field_type: text
          description: Tracked response record ID.
        - name: summary
          field_type: text
          description: Short human-readable outcome summary. Full detail is in the JSON body.
        - name: body
          field_type: text
          description: Full JSON of the operation result (outcome, posted, slack_ts, record_id, summary) for callers that need the complete record.
